<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Vault – CareerShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg cs-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-fill-check shield-icon"></i>
                <span>CareerShield<span class="text-info">.AI</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="nav-auth-container">
                    <!-- Populated dynamically by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-warning text-dark mb-2"><i class="bi bi-safe-fill me-1"></i> Forensic Storage</span>
                <h2 class="fw-bold text-white mb-1">Student Evidence Vault</h2>
                <p class="text-secondary small mb-0">Secure repository for fake offer letters, fraudulent payment demands, and incident proof.</p>
            </div>
            <button class="btn btn-warning text-dark fw-bold mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#newEvidenceModal">
                <i class="bi bi-plus-circle-fill me-1"></i> Log New Evidence
            </button>
        </div>

        <div class="row g-4" id="evidence-container">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-info" role="status"></div>
                <p class="mt-2">Unlocking your secure evidence vault...</p>
            </div>
        </div>
    </div>

    <!-- Modal to Add New Evidence -->
    <div class="modal fade" id="newEvidenceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content cs-card border-info border-opacity-50">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title text-white fw-bold"><i class="bi bi-safe-fill text-warning me-2"></i> Log Forensic Incident</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="evidence-form" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Incident / Case Title <span class="text-danger">*</span></label>
                            <input type="text" id="ev-title" class="form-control" placeholder="e.g. Fraudulent Offer Letter from TechNova" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Employer / Scammer Name</label>
                            <input type="text" id="ev-company" class="form-control" placeholder="e.g. Fake HR posing as Google">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Forensic Notes & Details <span class="text-danger">*</span></label>
                            <textarea id="ev-notes" class="form-control" rows="4" placeholder="Detail what happened: payment requests, UPI IDs, WhatsApp phone numbers, or threats made..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Attach Proof (Screenshot, Chat Export, or Offer PDF)</label>
                            <input type="file" id="ev-file" class="form-control" accept="image/*,application/pdf">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25">
                        <button type="button" class="btn btn-shield-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="btn-save-ev" class="btn btn-shield-primary">
                            <i class="bi bi-lock-fill me-1"></i> Store in Vault
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/evidence.js"></script>
</body>
</html>
