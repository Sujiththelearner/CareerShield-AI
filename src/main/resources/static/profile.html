<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile – CareerShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg cs-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-fill-check shield-icon"></i>
                <span>CareerShield<span class="text-info">.AI</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="nav-auth-container">
                    <!-- Populated dynamically by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="cs-card p-4 mb-4">
                    <div class="d-flex align-items-center gap-4 border-bottom border-secondary border-opacity-25 pb-4 mb-4">
                        <div class="rounded-circle bg-dark border border-info border-opacity-50 p-4 text-info text-center" style="width: 90px; height: 90px;">
                            <i class="bi bi-person-fill fs-1"></i>
                        </div>
                        <div>
                            <span class="badge bg-primary mb-1" id="profile-role">STUDENT</span>
                            <h3 class="fw-bold text-white mb-0" id="profile-name">Student Name</h3>
                            <p class="text-secondary small mb-0" id="profile-email">student@email.com</p>
                        </div>
                    </div>

                    <h5 class="text-info fw-bold mb-3"><i class="bi bi-mortarboard me-2"></i> Academic Affiliation</h5>
                    <div class="p-3 bg-dark rounded border border-secondary border-opacity-25 mb-4">
                        <div class="text-muted small">Registered University / College:</div>
                        <div class="text-white fw-semibold" id="profile-college">Not specified</div>
                    </div>

                    <h5 class="text-info fw-bold mb-3"><i class="bi bi-shield-lock me-2"></i> Account Security & Session</h5>
                    <div class="p-3 bg-dark rounded border border-secondary border-opacity-25 mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-white small fw-bold">Password Encryption</div>
                                <div class="text-muted small">Encrypted using Spring Security standard BCrypt cryptographic hash.</div>
                            </div>
                            <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Protected</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-25">
                        <a href="/dashboard.html" class="btn btn-shield-outline">
                            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                        </a>
                        <button class="btn btn-outline-danger" onclick="CareerAuth.logout()">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            CareerAuth.requireAuth();
            const user = CareerAuth.getUser();
            if (user) {
                document.getElementById('profile-name').textContent = user.fullName;
                document.getElementById('profile-email').textContent = user.email;
                document.getElementById('profile-role').textContent = user.role;
                document.getElementById('profile-college').textContent = user.collegeName || 'National Higher Education Institution';
            }
        });
    </script>
</body>
</html>
