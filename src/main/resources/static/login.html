<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CareerShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg cs-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-fill-check shield-icon"></i>
                <span>CareerShield<span class="text-info">.AI</span></span>
            </a>
            <div class="ms-auto">
                <a href="/register.html" class="btn btn-sm btn-shield-outline">Need an account? Register</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="cs-card">
                    <div class="text-center mb-4">
                        <div class="fs-1 text-info mb-2"><i class="bi bi-person-badge"></i></div>
                        <h3 class="fw-bold text-white">Student Login</h3>
                        <p class="text-secondary small">Access your scan history, evidence vault, and safety reports.</p>
                    </div>

                    <div id="alert-box" class="alert d-none small"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="student@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="btn-login" class="btn btn-shield-primary w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Box -->
                    <div class="p-3 bg-dark rounded border border-secondary border-opacity-25 mt-3">
                        <div class="text-muted small fw-bold mb-2 text-uppercase">Demo Accounts for Testing</div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-success flex-grow-1" onclick="fillStudent()">
                                <i class="bi bi-person-check me-1"></i> Student Demo
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-warning flex-grow-1" onclick="fillAdmin()">
                                <i class="bi bi-shield-lock me-1"></i> Admin Demo
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-secondary small mb-0">Don't have an account? <a href="/register.html" class="text-info fw-bold">Sign up here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function fillStudent() {
            document.getElementById('email').value = 'sujith@student.ac.in';
            document.getElementById('password').value = 'Password@123';
        }

        function fillAdmin() {
            document.getElementById('email').value = 'admin@careershield.ai';
            document.getElementById('password').value = 'Admin@12345';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const btn = document.getElementById('btn-login');
            
            alertBox.className = 'alert d-none small';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.success) {
                    alertBox.className = 'alert alert-success small';
                    alertBox.textContent = 'Login successful! Redirecting...';
                    CareerAuth.saveUser(json.data);
                    
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || (json.data.role === 'ADMIN' ? '/admin.html' : '/dashboard.html');
                    setTimeout(() => window.location.href = redirect, 600);
                } else {
                    alertBox.className = 'alert alert-danger small';
                    alertBox.textContent = json.message || 'Login failed. Please verify credentials.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Sign In';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.textContent = 'Unable to connect to Java server. Please ensure backend is running.';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Sign In';
            }
        });
    </script>
</body>
</html>
