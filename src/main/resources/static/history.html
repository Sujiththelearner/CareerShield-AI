<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History – CareerShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg cs-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-fill-check shield-icon"></i>
                <span>CareerShield<span class="text-info">.AI</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center" id="nav-auth-container">
                    <!-- Populated dynamically by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-white mb-1"><i class="bi bi-clock-history text-info me-2"></i> Scan History Archive</h2>
                <p class="text-secondary small mb-0">Browse and inspect all historical job and internship security evaluations.</p>
            </div>
            <a href="/scan.html" class="btn btn-shield-primary mt-2 mt-md-0">
                <i class="bi bi-plus-circle me-1"></i> Scan Another Posting
            </a>
        </div>

        <div class="cs-card mb-4 p-3">
            <div class="row g-3">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" id="search-input" class="form-control" placeholder="Search by job title, company name, or keyword..." oninput="filterScans()">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="filter-level" class="form-select" onchange="filterScans()">
                        <option value="ALL">All Risk Levels</option>
                        <option value="LOW">Low Risk (Safe)</option>
                        <option value="MEDIUM">Medium Risk (Review)</option>
                        <option value="HIGH">High Risk</option>
                        <option value="CRITICAL">Critical Scam Alert</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="cs-card p-4">
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Company</th>
                            <th>Date</th>
                            <th>Safety Score</th>
                            <th>Risk Level</th>
                            <th>Red Flags</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">Loading your scan records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/history.js"></script>
</body>
</html>
