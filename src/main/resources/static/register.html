<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – CareerShield AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg cs-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-fill-check shield-icon"></i>
                <span>CareerShield<span class="text-info">.AI</span></span>
            </a>
            <div class="ms-auto">
                <a href="/login.html" class="btn btn-sm btn-shield-outline">Existing User? Login</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="cs-card">
                    <div class="text-center mb-4">
                        <div class="fs-1 text-info mb-2"><i class="bi bi-person-plus"></i></div>
                        <h3 class="fw-bold text-white">Create Student Account</h3>
                        <p class="text-secondary small">Join students protecting themselves against fraudulent internships.</p>
                    </div>

                    <div id="alert-box" class="alert d-none small"></div>

                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-person"></i></span>
                                <input type="text" id="fullName" class="form-control" placeholder="e.g. John Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">College / University Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-mortarboard"></i></span>
                                <input type="text" id="collegeName" class="form-control" placeholder="e.g. National Institute of Technology" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="john@student.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" id="btn-register" class="btn btn-shield-primary w-100 py-2 mb-3">
                            <i class="bi bi-check-circle me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-secondary small mb-0">Already registered? <a href="/login.html" class="text-info fw-bold">Sign in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const btn = document.getElementById('btn-register');
            
            alertBox.className = 'alert d-none small';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                collegeName: document.getElementById('collegeName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: 'STUDENT'
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.success) {
                    alertBox.className = 'alert alert-success small';
                    alertBox.textContent = 'Account created! Redirecting to dashboard...';
                    CareerAuth.saveUser(json.data);
                    setTimeout(() => window.location.href = '/dashboard.html', 700);
                } else {
                    alertBox.className = 'alert alert-danger small';
                    alertBox.textContent = json.message || 'Registration failed. Check your inputs.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Register Account';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.textContent = 'Connection error. Please ensure the Java Spring Boot backend is active.';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Register Account';
            }
        });
    </script>
</body>
</html>
