# ==========================================================
# CareerShield AI - Server Configuration
# ==========================================================
server.port=${PORT:8080}
spring.application.name=CareerShield-AI

# ==========================================================
# Database Configuration (Production-Safe via Environment Variables)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/careershield_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# ==========================================================
# JPA / Hibernate Configuration
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

# ==========================================================
# Multipart File Upload Settings (Screenshots / Offer Letters)
# ==========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==========================================================
# CareerShield Custom Application Properties
# ==========================================================
careershield.upload.dir=${CAREERSHIELD_UPLOAD_DIR:uploads/evidence}
careershield.ml.service-url=${CAREERSHIELD_ML_SERVICE_URL:http://localhost:8000/predict}
careershield.ml.fallback-enabled=true
